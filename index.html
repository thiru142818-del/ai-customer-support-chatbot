
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Customer Support Chatbot Prototype">
    <title>Customer Support Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="bot-avatar">AI</div>
            <div>
                <h1>Customer Support</h1>
                <p class="status">● Online</p>
            </div>
        </header>

        <section class="chat-messages" id="chatMessages"
                 aria-live="polite">
            <div class="message bot-message">
                <p>Hello! 👋 Welcome to Customer Support.</p>
                <p>How can I help you today?</p>
            </div>
        </section>

        <div class="quick-questions">
            <button class="quick-btn" data-question="Track my order">
                Track Order
            </button>
            <button class="quick-btn" data-question="What is your return policy?">
                Returns
            </button>
            <button class="quick-btn" data-question="When will my delivery arrive?">
                Delivery
            </button>
            <button class="quick-btn" data-question="What payment methods do you accept?">
                Payments
            </button>
        </div>

        <form class="chat-input" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
                aria-label="Type your question"
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>

        <footer class="chat-footer">
            Prototype chatbot using HTML, CSS and JavaScript
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
